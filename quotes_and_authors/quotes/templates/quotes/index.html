{% extends 'quotes_and_authors/base.html' %}

{% block title %}
    <title>Quotes</title>
{% endblock %}

{% block content %}
    {% for quote in quotes %}
        <p>{{ quote.quote }}</p>
        <p>{{ quote.author }}</p>
        {% for tag in quote.tags.all %}
            <p>{{ tag }}</p>
        {% endfor %}
    {% endfor %}
{% endblock %}
